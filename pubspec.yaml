name: users
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  gap: ^3.0.1
  email_validator: ^3.0.0
  intl_phone_field: ^3.2.0
  firebase_auth: ^6.0.0
  firebase_database: ^12.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  fluttertoast: ^8.2.12
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  geocoder2: ^1.4.0
  flutter_polyline_points: ^3.0.1
  location: ^8.0.1
  smooth_star_rating_nsafe: ^1.0.0+1
  animated_text_kit: ^4.2.3
  provider: ^6.1.5
  url_launcher: ^6.3.0

flutter_geofire: ^2.0.6
dependency_overrides:
  http: ^1.2.1




dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter:


  uses-material-design: true

  assets:
     - assets/
     - assets/city/
     - assets/location/
     - assets/users_image/
     - assets/map_style/light_map.json
     - assets/map_style/dark_map.json
